name: check

# Once per night (~00:00 IST). Manual re-run via Actions tab.
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: make check
        run: make check
